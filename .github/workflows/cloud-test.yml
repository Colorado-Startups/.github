name: cloud-test

# The one shared definition of a cloud test run for every Colorado Startups repo. Cloud first, the Mac last and
# small (Paul, 2026-11-02): test suites, builds, browsers and renders run on hosted runners, so a session runs one
# through its repo's thin caller (workflow-templates/cloud-test.yml):
#
#   gh workflow run cloud-test.yml --ref <branch> -f script=<name> -f shards=<1 to 8>
#   gh run list --workflow cloud-test.yml --limit 1, then gh run view <id>
#
# The caller repo holds the allowlist, .github/cloud-test.json. The plan job reads it from the caller's default
# branch, or on a pull request from the merge commit that the caller workflow itself came from, and never from the
# `ref` input. It passes the one validated entry to the shards as JSON through env, so no shard reads an allowlist
# from the code under test. cloud-test/cloud_test.py in this repo holds every rule; this file only wires runners
# to it. Each job checks that script out of this repo at job.workflow_sha, the commit the caller pinned, so the
# caller's pin covers every file that runs. cloud-test/README.md has the allowlist format.
#
# Money: free tiers and included minutes only (Paul, 2026-11-02). Shards run on the CI_RUNNER variable, a plain
# label, else ubuntu-latest; cloud_test.py refuses larger and self-hosted runners. Every job has a timeout.
# Concurrency and path filters belong to the caller.
#
# Security: inputs reach a shell only through env, and cloud_test.py validates each before anything uses it. A
# read-only token, no secrets, every action pinned to a full SHA. The plan job has no cache access and the shards
# may only restore, so code under test can never write a cache another run restores.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or branch to test. Empty tests the commit the caller ran on
        required: false
        default: ""
        type: string
      script:
        description: A name from the caller's .github/cloud-test.json
        required: true
        type: string
      shards:
        description: Parallel shards, 1 to 8. A script with no shard entry runs as one job
        required: false
        default: "1"
        type: string
      node-version:
        description: Node version for actions/setup-node. Empty uses .nvmrc when the repo has one
        required: false
        default: ""
        type: string
      python:
        description: Python version for actions/setup-python. Empty uses the runner's python3
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    # A standard GitHub-hosted runner on purpose, not CI_RUNNER: this job only validates and plans, in seconds, on
    # the cheapest runner the included minutes cover.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    cache-mode: none
    outputs:
      script: ${{ steps.plan.outputs.script }}
      slug: ${{ steps.plan.outputs.slug }}
      sha: ${{ steps.plan.outputs.sha }}
      total: ${{ steps.plan.outputs.total }}
      matrix: ${{ steps.plan.outputs.matrix }}
      timeout: ${{ steps.plan.outputs.timeout }}
      runner: ${{ steps.plan.outputs.runner }}
      entry: ${{ steps.plan.outputs.entry }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      pip: ${{ steps.plan.outputs.pip }}
    steps:
      - name: Check out cloud_test.py at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: cloud-test
          persist-credentials: false

      - name: Check the ref and resolve it to one commit
        id: ref
        env:
          REF: ${{ inputs.ref || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I cloud-test/cloud_test.py ref --ref="$REF"
          echo "sha=$(python3 -I cloud-test/cloud_test.py resolve --ref="$REF")" >> "$GITHUB_OUTPUT"

      # The allowlist comes from where the caller workflow came from: the default branch, or a pull request's merge
      # commit (the caller file on that commit already decides what runs). A dispatched ref never supplies it.
      - name: Check out the caller's allowlist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}
          path: caller
          sparse-checkout: .github/cloud-test.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan the shards
        id: plan
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          SCRIPT: ${{ inputs.script }}
          SHARDS: ${{ inputs.shards }}
          PYTHON: ${{ inputs.python }}
          CI_RUNNER: ${{ vars.CI_RUNNER }}
        run: |
          python3 -I cloud-test/cloud_test.py plan --allowlist=caller/.github/cloud-test.json \
            --script="$SCRIPT" --shards="$SHARDS" --python="$PYTHON" --sha="$SHA"

  run:
    needs: plan
    name: ${{ needs.plan.outputs.script }} ${{ matrix.shard }}/${{ needs.plan.outputs.total }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # Second, because a checkout into the workspace root clears what is there. .git/info/exclude keeps it out of
      # git status and git ls-files, which most repo gates walk.
      - name: Check out cloud_test.py and the setup action at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cloud-test
          sparse-checkout: |
            cloud-test
            .github/actions/setup
          persist-credentials: false
      - run: if [ -d .git/info ]; then echo /.cloud-test/ >> .git/info/exclude; fi

      - uses: ./.cloud-test/.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          python-version: ${{ inputs.python }}
          pip-requirements: ${{ needs.plan.outputs.pip }}

      - name: Run the script
        env:
          SCRIPT: ${{ needs.plan.outputs.script }}
          INDEX: ${{ matrix.shard }}
          TOTAL: ${{ needs.plan.outputs.total }}
          CLOUD_TEST_ENTRY: ${{ needs.plan.outputs.entry }}
          CLOUD_TEST_REF: ${{ needs.plan.outputs.sha }}
          CLOUD_TEST_RUNNER: ${{ needs.plan.outputs.runner }}
        run: |
          python3 -I .cloud-test/cloud-test/cloud_test.py run --script="$SCRIPT" --index="$INDEX" --total="$TOTAL"

      - if: always() && needs.plan.outputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-test-${{ needs.plan.outputs.slug }}-${{ matrix.shard }}-of-${{ needs.plan.outputs.total }}
          path: ${{ needs.plan.outputs.artifacts }}
          retention-days: 7
          if-no-files-found: warn
