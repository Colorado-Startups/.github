name: secret-scan

# ADVISORY until a ruleset requires the secret-scan check; the orchestrator
# merges only when every check is green.
#
# gitleaks over the whole history, so a credential that a later commit removed
# still fails the run. Values are redacted in the log; a finding prints its
# file, commit and rule id. It runs the MIT gitleaks release binary, not
# gitleaks/gitleaks-action, which needs a licence for organization repos.
# The tarball is pinned by version and by the SHA-256 from that release's
# gitleaks_8.30.1_checksums.txt (read 2026-11-02); a mismatch never installs.
# Identical copies run in other Colorado-Startups repos: move the version and
# the SHA-256 in all of them together.
#
# No schedule: with the binary pinned, rerunning an unchanged history finds
# nothing new. No event input reaches a run: step.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip
          persist-credentials: false

      - name: Install gitleaks (pinned release, SHA-256 checked)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Exit 7 means findings, so any other non-zero code is a broken scanner,
      # never a pass. Actions runs bash -e, so each code is caught with ||.
      # The fake is built at run time and lives only in a throwaway repo;
      # deleting it before the scan proves history is read.
      - name: Self-test (a clean history passes, a deleted fake still fails)
        run: |
          set -u
          gl="$RUNNER_TEMP/gitleaks"; t="$RUNNER_TEMP/selftest"
          git init -q "$t"
          git -C "$t" config user.name selftest
          git -C "$t" config user.email selftest@example.com
          echo "nothing to find" > "$t/clean.txt"
          git -C "$t" add clean.txt && git -C "$t" commit -qm clean
          rc=0; "$gl" git --no-banner --exit-code 7 "$t" || rc=$?
          [ "$rc" -eq 0 ] || { echo "::error::self-test: clean history gave exit $rc, expected 0"; exit 1; }
          printf 'gh = "ghp_%s%s%s%s"\n' 7Gq2Lm9Xa1 Rt5Wz3Kp8B n4Vc6Yh0Ju2 Ed5Fs > "$t/seeded.txt"
          git -C "$t" add seeded.txt && git -C "$t" commit -qm seeded
          git -C "$t" rm -q seeded.txt && git -C "$t" commit -qm removed
          rc=0; "$gl" git --no-banner --redact --exit-code 7 "$t" || rc=$?
          [ "$rc" -eq 7 ] || { echo "::error::self-test: a deleted fake gave exit $rc, expected 7"; exit 1; }
          echo "self-test: ok"

      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 .'
