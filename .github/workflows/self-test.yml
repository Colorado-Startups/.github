name: self-test

# ADVISORY until a ruleset requires it; the orchestrator merges only when every check is green.
#
# self-test runs cloud_test.py's seeded known-bad and known-clean inputs. smoke then calls the shared workflow the
# way a repo's caller does, from this commit: the plan job, a two-shard matrix, the checkout of cloud_test.py at
# job.workflow_sha, the setup action's Node and Python paths, the {index}/{total} shard flag and the job summary.
# A dispatch reaches only a workflow already on main, so this pull request run is how a change here gets tested.
# Path filters keep doc-only changes from spending minutes (Paul's money rule, 2026-11-02).
on:
  pull_request:
    paths:
      - cloud-test/**
      - ci-pool/**
      - .github/workflows/ci-pool-meter.yml
      - .github/workflows/cloud-test.yml
      - .github/workflows/self-test.yml
      - .github/actions/**
      - .github/cloud-test.json
      - workflow-templates/**
  push:
    branches: [main]
    paths:
      - cloud-test/**
      - ci-pool/**
      - .github/workflows/ci-pool-meter.yml
      - .github/workflows/cloud-test.yml
      - .github/workflows/self-test.yml
      - .github/actions/**
      - .github/cloud-test.json
      - workflow-templates/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I cloud-test/cloud_test.py --self-test
      - run: python3 -I cloud-test/cloud_test.py check --allowlist=.github/cloud-test.json
      - run: python3 -I ci-pool/ci_pool.py --self-test

  # The chooser as a repo calls it: the composite action from this commit, with no reading (GitHub-hosted, the safe
  # default), then the job it picked. A known-bad reading must also land on GitHub-hosted.
  ci-pool:
    needs: self-test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pool.outputs.runner }}
      run: ${{ steps.pool.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./ci-pool
        id: pool
        with:
          pool: ""
          paths: ci-pool/**
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: ./ci-pool
        id: bad
        with:
          pool: '{"version":1,"at":"2020-01-01T00:00:00Z","complete":true,"blacksmith":{"used":0}}'
          override: blacksmith-2vcpu-ubuntu-2404
      - env:
          GOOD: ${{ steps.pool.outputs.label }}
          BAD: ${{ steps.bad.outputs.label }}
        run: |
          test "$GOOD" = ubuntu-latest || { echo "::error::no reading chose $GOOD"; exit 1; }
          test "$BAD" = ubuntu-latest || { echo "::error::a stale reading chose $BAD"; exit 1; }

  ci-pool-job:
    needs: ci-pool
    if: needs.ci-pool.outputs.run == 'true'
    runs-on: ${{ needs.ci-pool.outputs.runner && fromJSON(needs.ci-pool.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - run: echo "ran on the chosen runner"

  smoke:
    needs: self-test
    uses: ./.github/workflows/cloud-test.yml
    with:
      script: smoke
      shards: "2"
      node-version: lts/*
      python: "3.x"
